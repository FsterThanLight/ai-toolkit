---
job: "extension"
config:
  name: "qwen_image_edit_2511_print_extract_v1"
  process:
    - type: "diffusion_trainer"
      training_folder: "/root/ai-toolkit/output"
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: null
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: "bf16"
        save_every: 200
        max_step_saves_to_keep: 8
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "/root/ai-toolkit/datasets/target"
          default_caption: "extract only the clothing print as a flat, front-aligned, clean texture sheet, preserve small text, no garment outline, no wrinkles"
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: false
          cache_text_embeddings: true
          full_size_control_images: true
          is_reg: false
          network_weight: 1
          resolution:
            - 512
            - 768
            - 1024
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 2
          control_path_1: "/root/ai-toolkit/datasets/control"
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3200
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "weighted"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: true
        lr: 0.00006
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: true
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "clothing print"
        switch_boundary_every: 1
        loss_type: "wavelet"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Qwen/Qwen-Image-Edit-2511"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        arch: "qwen_image_edit_plus:2511"
        low_vram: true
        model_kwargs:
          match_target_res: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
      sample:
        sampler: "flowmatch"
        sample_every: 200
        width: 1024
        height: 1024
        samples:
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, preserve small text, no garment outline, no wrinkles"
            ctrl_img_1: "/root/ai-toolkit/data/images/7e26f57d-89a7-440b-aeac-f722d7413f4b.png"
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, preserve all tiny letters and thin lines, no garment outline"
            ctrl_img_1: "/root/ai-toolkit/data/images/da012717-f17a-4800-a659-5038a24cdf73.png"
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, remove perspective distortion and wrinkles"
            ctrl_img_1: "/root/ai-toolkit/data/images/c5111428-6f1d-49cf-9400-49701a1f59e7.png"
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, preserve small text, remove garment structure and shadows"
            ctrl_img_1: "/root/ai-toolkit/data/images/ecce76f1-6d42-4dd3-b7a3-66ca5fb69315.png"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 28
        num_frames: 1
        fps: 1
meta:
  name: "qwen_image_edit_2511_print_extract_v1"
  version: "1.0"
