---
job: "extension"
config:
  name: "flux2_klein_9b_print_extract_v12"
  process:
    - type: "diffusion_trainer"
      training_folder: "/root/ai-toolkit/output"
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: null
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: "bf16"
        save_every: 500
        max_step_saves_to_keep: 10
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "D:/临时/AI绘图训练/荣益素材_klein_ready/target"
          mask_path: null
          mask_min_value: 0.1
          default_caption: "Extract only the graphic print from the garment and remove the garment itself. Please remove all distortion and perspective caused by fabric folds or body shape to ensure the pattern is perfectly flat, horizontal, and vertical. Restore the original aspect ratio and ensure the colors of the text and graphics are accurate. Sharpen any blurry text for high-definition clarity. Place the extracted graphic on a plain light-colored solid background."
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: false
          cache_text_embeddings: false
          full_size_control_images: true
          is_reg: false
          network_weight: 1
          resolution:
            - 512
            - 768
            - 1024
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 2
          control_path_1: "D:/临时/AI绘图训练/荣益素材_klein_ready/control"
          control_path_2: null
          control_path_3: null
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3200
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "weighted"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false
        lr: 0.00006
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: true
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "clothing print"
        switch_boundary_every: 1
        loss_type: "wavelet"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        arch: "flux2_klein_9b"
        low_vram: true
        model_kwargs:
          match_target_res: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
      sample:
        sampler: "flowmatch"
        sample_every: 200
        width: 1024
        height: 1024
        samples: []
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 28
        num_frames: 1
        fps: 1
meta:
  name: "flux2_klein_9b_print_extract_v12"
  version: "12.0"
