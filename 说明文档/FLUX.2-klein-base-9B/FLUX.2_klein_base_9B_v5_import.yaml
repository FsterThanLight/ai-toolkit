---
job: "extension"
config:
  name: "flux2_klein_9b_print_extract_v5"
  process:
    - type: "diffusion_trainer"
      training_folder: "/root/ai-toolkit/output"
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: null
      performance_log_every: 10
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: "bf16"
        save_every: 200
        max_step_saves_to_keep: 8
        save_format: "diffusers"
        push_to_hub: false
      datasets:
        - folder_path: "D:/PycharmProjects/ai-toolkit/说明文档/训练集/klein_base_9B_ready_v5/target"
          mask_path: null
          mask_min_value: 0.1
          default_caption: "Extract only the graphic print from the garment and remove the garment itself.. Please remove all distortion and perspective caused by fabric folds or body shape to ensure the pattern is perfectly flat, horizontal, and vertical. Restore the original aspect ratio and ensure the colors of the text and graphics are accurate. Sharpen any blurry text for high-definition clarity. Set the final background to light gray."
          caption_ext: "txt"
          caption_dropout_rate: 0
          cache_latents_to_disk: false
          cache_text_embeddings: false
          full_size_control_images: true
          is_reg: false
          network_weight: 1
          resolution:
            - 512
            - 768
            - 1024
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 2
          control_path_1: "D:/PycharmProjects/ai-toolkit/说明文档/训练集/klein_base_9B_ready_v5/control"
          control_path_2: null
          control_path_3: null
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3200
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "weighted"
        content_or_style: "balanced"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false
        lr: 0.00006
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: true
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "clothing print"
        switch_boundary_every: 1
        loss_type: "wavelet"
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        arch: "flux2_klein_9b"
        low_vram: true
        model_kwargs:
          match_target_res: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
      sample:
        sampler: "flowmatch"
        sample_every: 200
        width: 1024
        height: 1024
        samples:
          - prompt: "Extract only the graphic print from the garment and remove the garment itself.. Please remove all distortion and perspective caused by fabric folds or body shape to ensure the pattern is perfectly flat, horizontal, and vertical. Restore the original aspect ratio and ensure the colors of the text and graphics are accurate. Sharpen any blurry text for high-definition clarity. Set the final background to light gray."
            ctrl_img_1: "/root/ai-toolkit/data/images/e23e27ba-d6b2-4366-8886-67cd355cf630.png"
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, preserve all tiny letters and thin lines, no garment outline"
            ctrl_img_1: "/root/ai-toolkit/data/images/f0296882-b2df-47d3-9398-8a788f51f2a9.png"
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, remove perspective distortion and wrinkles"
            ctrl_img_1: "/root/ai-toolkit/data/images/629169e1-a1b7-4829-9bb7-e373ca442142.png"
          - prompt: "extract only the clothing print as a flat, front-aligned, clean texture sheet, preserve small text, remove garment structure and shadows"
            ctrl_img_1: "/root/ai-toolkit/data/images/27e398be-97b7-42c6-a784-c8b45666a987.png"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 28
        num_frames: 1
        fps: 1
meta:
  name: "flux2_klein_9b_print_extract_v5"
  version: "5.0"
