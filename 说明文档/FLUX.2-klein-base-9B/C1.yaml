      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: adamw8bit
      timestep_type: weighted
      content_or_style: balanced
      optimizer_params:
        weight_decay: 0.0001
      lr: 4e-5
      dtype: bf16
      loss_type: wavelet
    model:
      name_or_path: black-forest-labs/FLUX.2-klein-base-9B
      quantize: true
      qtype: qfloat8
      quantize_te: true
      qtype_te: qfloat8
      arch: flux2_klein_9b
      low_vram: true
      model_kwargs:
        match_target_res: false
    sample:
      sampler: flowmatch
      sample_every: 250
      width: 1024
      height: 1024
      samples: []
      neg: ''
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 30
      num_frames: 1
      fps: 1
    logging:
